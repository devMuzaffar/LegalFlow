<div>
  <!-- Header -->
  <auth-page-header
    title="Set a new password"
    subtitle="Your new password must be different from passwords used previously."
  />

  <!-- Invalid / missing token -->
  @if (!token) {
    <div class="mb-6 rounded-lg border border-surface bg-surface-50 p-4 text-sm text-muted-color">
      This reset link is invalid or has expired. Please
      <a routerLink="/auth/forgot-password" class="font-medium text-primary hover:underline">
        request a new one </a
      >.
    </div>
  }

  <!-- Reset Password Form -->
  <form (ngSubmit)="onSubmit()" class="flex flex-col gap-5">
    <!-- New Password -->
    <div class="flex flex-col gap-2">
      <label for="new-password" class="text-sm font-medium text-surface-900"> New password </label>
      <p-iconfield class="w-full">
        <input
          id="new-password"
          pInputPassword
          [mask]="passwordMasked()"
          [ngModel]="password()"
          (ngModelChange)="password.set($event)"
          name="password"
          placeholder="At least {{ minLength }} characters"
          autocomplete="new-password"
          class="w-full"
          required
        />
        <p-inputicon class="cursor-pointer" (click)="passwordMasked.set(!passwordMasked())">
          @if (passwordMasked()) {
            <svg data-p-icon="eye" class="text-surface-500"></svg>
          } @else {
            <svg data-p-icon="eye-slash" class="text-surface-500"></svg>
          }
        </p-inputicon>
      </p-iconfield>
    </div>

    <!-- Confirm Password -->
    <div class="flex flex-col gap-2">
      <label for="confirm-password" class="text-sm font-medium text-surface-900">
        Confirm password
      </label>
      <p-iconfield class="w-full">
        <input
          id="confirm-password"
          pInputPassword
          [mask]="confirmMasked()"
          [ngModel]="confirmPassword()"
          (ngModelChange)="confirmPassword.set($event)"
          name="confirmPassword"
          placeholder="Re-enter your password"
          autocomplete="new-password"
          class="w-full"
          required
        />
        <p-inputicon class="cursor-pointer" (click)="confirmMasked.set(!confirmMasked())">
          @if (confirmMasked()) {
            <svg data-p-icon="eye" class="text-surface-500"></svg>
          } @else {
            <svg data-p-icon="eye-slash" class="text-surface-500"></svg>
          }
        </p-inputicon>
      </p-iconfield>

      <!-- Mismatch hint -->
      @if (mismatch()) {
        <small class="text-xs text-red-500">Passwords do not match.</small>
      }
    </div>

    <!-- Submit -->
    <button pButton type="submit" class="w-full" [disabled]="!canSubmit()">Reset password</button>

    <!-- Back to Login -->
    <div class="text-center">
      <a
        routerLink="/auth/login"
        class="text-sm font-medium text-surface-600 hover:text-surface-900"
      >
        ← Back to login
      </a>
    </div>
  </form>
</div>
