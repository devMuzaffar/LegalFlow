<div>
  <!-- Header -->
  <auth-page-header
    title="Forgot password?"
    subtitle="Enter your email address and we'll send you instructions to reset your password."
  />

  <!-- Forgot Password Form -->
  <form (ngSubmit)="onSubmit()" class="flex flex-col gap-5">
    <!-- Email Field -->
    <div class="flex flex-col gap-2">
      <label for="reset-email" class="text-sm font-medium text-surface-900">
        Email address
      </label>
      <input
        id="reset-email"
        type="email"
        pInputText
        [(ngModel)]="email"
        name="email"
        placeholder="name@company.com"
        class="w-full"
        required
      />
    </div>

    <!-- Submit Button -->
    <button pButton type="submit" class="w-full">
      Send Reset Instructions
    </button>

    <!-- Back to Login -->
    <div class="text-center">
      <a
        routerLink="/auth/login"
        class="text-sm font-medium text-surface-600 hover:text-surface-900"
      >
        ← Back to login
      </a>
    </div>
  </form>
</div>
