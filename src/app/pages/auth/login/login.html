<div>
  <!-- Header -->
  <auth-page-header title="Welcome back" subtitle="Please enter your details to sign in to your account." />

  <!-- Login Form -->
  <form (ngSubmit)="onSubmit()" class="flex flex-col gap-5">
    <!-- Email Field -->
    <div class="flex flex-col gap-2">
      <label for="email" class="text-sm font-medium text-surface-900">
        Email address
      </label>
      <input id="email" type="email" pInputText [(ngModel)]="email" name="email" placeholder="name@company.com"
        class="w-full" required />
    </div>

    <!-- Password Field -->
    <div class="flex flex-col gap-2">
      <div class="flex items-center justify-between">
        <label for="password" class="text-sm font-medium text-surface-900">
          Password
        </label>
        <a routerLink="/auth/forgot-password" class="text-sm font-medium text-primary hover:underline">
          Forgot password?
        </a>
      </div>
      <p-iconfield class="w-full">
        <input id="password" pInputPassword [(mask)]="isPasswordMasked" [(ngModel)]="password" name="password"
          placeholder="Enter your password" class="w-full" required />
        <p-inputicon class="cursor-pointer" (click)="isPasswordMasked = !isPasswordMasked">
          @if (isPasswordMasked) {
          <svg data-p-icon="eye" class="text-surface-500"></svg>
          } @else {
          <svg data-p-icon="eye-slash" class="text-surface-500"></svg>
          }
        </p-inputicon>
      </p-iconfield>
    </div>

    <!-- Submit Button -->
    <button pButton type="submit" class="w-full">
      Login
    </button>
  </form>
</div>
