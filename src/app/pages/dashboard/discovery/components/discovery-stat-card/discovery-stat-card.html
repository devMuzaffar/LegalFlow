<app-card [title]="title()">
  <div action class="flex h-9 w-9 items-center justify-center rounded-lg" [class]="iconWrapClass()">
    <i [class]="'pi text-sm ' + icon()"></i>
  </div>

  <div class="flex flex-1 flex-col gap-2">
    <div class="flex items-start justify-between gap-2">
      <p class="text-2xl leading-none font-semibold tabular-nums" [class]="valueClass()">
        {{ value() | number }}
      </p>
      @if (badge(); as tagValue) {
        <p-tag [value]="tagValue" [severity]="badgeSeverity()" />
      }
    </div>
    <p class="text-muted-color text-xs">{{ subtitle() }}</p>
  </div>
</app-card>
