<app-card
  title="Withheld Privilege Log"
  subtitle="Mandatory privilege log schedule for withheld attorney-client and work-product records."
>
  <button action pButton type="button" size="small" (click)="onDownloadCsv()">
    <i class="pi pi-download text-xs"></i>
    Download CSV
  </button>

  <p-table [value]="rows()" dataKey="docId" [showGridlines]="false">
    <ng-template #header>
      <tr>
        <th>Doc ID</th>
        <th>Control #</th>
        <th>Date</th>
        <th>Custodian</th>
        <th>Privilege Type</th>
        <th>Withholding Basis</th>
      </tr>
    </ng-template>

    <ng-template #body let-e>
      <tr>
        <td class="text-surface-900 font-mono text-xs font-semibold whitespace-nowrap">
          {{ e.docId }}
        </td>
        <td class="font-mono text-xs whitespace-nowrap">{{ e.batesControl }}</td>
        <td class="text-muted-color text-xs whitespace-nowrap tabular-nums">
          {{ e.date | date: 'dd MMM yyyy' }}
        </td>
        <td class="text-surface-900 font-medium whitespace-nowrap">{{ e.custodian }}</td>
        <td>
          <p-tag
            class="whitespace-nowrap"
            [value]="e.privilegeType"
            [severity]="privilegeSeverity(e.privilegeType)"
          />
        </td>
        <td class="text-muted-color text-xs">{{ e.basis }}</td>
      </tr>
    </ng-template>

    <ng-template #emptymessage>
      <tr>
        <td colspan="6" class="text-muted-color py-6 text-center text-xs">
          No privileged documents have been withheld for this production set.
        </td>
      </tr>
    </ng-template>
  </p-table>
</app-card>
