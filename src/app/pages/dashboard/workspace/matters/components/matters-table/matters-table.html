<app-card
  title="Matters Directory"
  subtitle="Click any matter row to inspect its custodian preservation holds below."
>
  <span action class="text-muted-color text-xs">{{ rows().length }} matters</span>

  <p-table [value]="rows()" dataKey="id" [showGridlines]="false">
    <ng-template #header>
      <tr>
        <th>Matter ID</th>
        <th>Case Name</th>
        <th>Status</th>
        <th class="text-right">Custodians</th>
        <th class="text-right">Corpus Size</th>
        <th class="text-right">Action</th>
      </tr>
    </ng-template>

    <ng-template #body let-m>
      <tr
        class="cursor-pointer transition-colors"
        [class]="m.id === inspectedMatterId() ? 'bg-primary-50/70' : 'hover:bg-surface-50'"
        (click)="inspect.emit(m.id)"
      >
        <td class="text-surface-900 font-mono text-xs font-semibold">{{ m.id }}</td>
        <td>
          <div class="flex flex-col">
            <span class="text-surface-900 font-medium">{{ m.name }}</span>
            <span class="text-muted-color text-xs">Lead: {{ m.leadCounsel }}</span>
          </div>
        </td>
        <td>
          <p-tag [value]="statusLabel(m.status)" [severity]="statusSeverity(m.status)" />
        </td>
        <td class="text-right tabular-nums">{{ custodianCount(m.id) }}</td>
        <td class="text-right text-xs tabular-nums">
          <span class="text-surface-900 font-medium">{{ m.corpusSizeGb }} GB</span>
          <span class="text-muted-color"> · {{ m.docCount | number }} docs</span>
        </td>
        <td class="text-right">
          @if (m.id === activeMatterId()) {
            <p-tag value="Active Workspace" severity="success" />
          } @else {
            <button
              pButton
              type="button"
              size="small"
              [outlined]="true"
              (click)="$event.stopPropagation(); switchActive.emit(m.id)"
            >
              Switch Active
            </button>
          }
        </td>
      </tr>
    </ng-template>
  </p-table>
</app-card>
