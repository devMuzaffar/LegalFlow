<div class="flex flex-col gap-2">
  <!-- Search, mode and filters on one 12 column grid -->
  <p-card [pt]="{ body: { class: 'p-3!' } }">
    <div class="grid grid-cols-12 items-center gap-2">
      <!-- Search -->
      <div class="col-span-12 lg:col-span-8">
        <p-iconfield class="w-full">
          <p-inputicon class="pi pi-search" />
          <input
            pInputText
            class="w-full"
            [value]="query()"
            (input)="onInput($event)"
            placeholder='Search documents — try "breach AND account"'
            aria-label="Search documents"
          />
        </p-iconfield>
      </div>

      <!-- Search mode -->
      <div class="col-span-6 lg:col-span-2">
        <p-select
          [fluid]="true"
          [options]="modeOptions"
          optionLabel="label"
          optionValue="value"
          [ngModel]="mode()"
          (ngModelChange)="onModeChange($event)"
          ariaLabel="Search mode"
        />
      </div>

      <!-- Document filter -->
      <div class="col-span-6 lg:col-span-2">
        <p-select
          [fluid]="true"
          [options]="filterOptions"
          optionLabel="label"
          optionValue="value"
          [ngModel]="filter()"
          (ngModelChange)="onFilterChange($event)"
          ariaLabel="Filter documents"
        />
      </div>

      <!-- Active custodian -->
      @if (custodianName(); as name) {
        <div class="col-span-12">
          <span
            class="bg-primary-50 text-primary inline-flex items-center gap-1 rounded-full py-0.5 pr-1 pl-2.5 text-xs font-medium"
          >
            <i class="pi pi-user text-[11px]"></i>
            {{ name }}
            <button
              pButton
              type="button"
              [text]="true"
              [rounded]="true"
              size="small"
              severity="secondary"
              class="h-5! w-5! p-0!"
              (click)="clearCustodian.emit()"
              aria-label="Clear custodian filter"
            >
              <i class="pi pi-times text-[11px]"></i>
            </button>
          </span>
        </div>
      }
    </div>
  </p-card>
</div>
