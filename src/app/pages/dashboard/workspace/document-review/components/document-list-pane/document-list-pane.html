<div class="flex min-h-0 flex-1 flex-col">
  @if (documents().length) {
    <!-- Summary & Rows -->
    <div
      class="border-surface flex shrink-0 flex-wrap items-center justify-between gap-2 border-b px-3 py-2 text-xs"
    >
      <span class="text-muted-color">
        Showing {{ rangeStart() }}-{{ rangeEnd() }} of {{ total() }}
      </span>

      <div class="flex items-center gap-1.5">
        <label for="doc-rows-select" class="text-muted-color">Rows</label>
        <p-select
          inputId="doc-rows-select"
          size="small"
          [options]="rowsOptions"
          [ngModel]="rows()"
          (ngModelChange)="onRowsChange($event)"
          appendTo="body"
          ariaLabel="Rows per page"
        />
      </div>
    </div>

    <!-- Cards -->
    <div class="flex-1 overflow-auto pr-1">
      <ul class="flex flex-col gap-2 p-2">
        @for (doc of documents(); track doc.id) {
          <li>
            <button
              type="button"
              class="w-full rounded-lg border p-2.5 text-left transition-colors"
              [class]="
                doc.id === selectedId()
                  ? 'border-emerald-500 bg-emerald-50'
                  : 'border-surface bg-surface-0 hover:bg-surface-50'
              "
              (click)="select.emit(doc.id)"
            >
              <!-- Row 1: id + source + status -->
              <div class="flex items-center justify-between gap-2">
                <span class="text-surface-900 font-mono text-xs font-semibold">{{ doc.id }}</span>
                <div class="flex items-center gap-1">
                  <span
                    class="size-2 rounded-full"
                    [class]="isCoded(doc) ? 'bg-emerald-500' : 'bg-surface-300'"
                    [attr.title]="isCoded(doc) ? 'Coded' : 'Unreviewed'"
                  ></span>
                  <p-tag
                    [value]="doc.sourceType"
                    [severity]="sourceSeverity(doc.sourceType)"
                    [rounded]="true"
                  />
                </div>
              </div>

              <!-- Row 2: subject -->
              <p class="text-surface-900 mt-1 line-clamp-2 text-[13px] leading-5 font-medium">
                {{ doc.subject }}
              </p>

              <!-- Row 3: custodian + date + risk -->
              <div class="text-muted-color mt-1.5 flex items-center justify-between gap-2 text-xs">
                <span class="truncate">{{ doc.custodianName }}</span>
                <span class="shrink-0">{{ doc.receivedAt | date: 'dd MMM' }}</span>
              </div>

              <div class="mt-1 flex flex-wrap items-center gap-1">
                <span
                  class="bg-surface-100 text-muted-color rounded-full px-1.5 py-0.5 text-[11px]"
                >
                  {{ doc.threadCount }} msg
                </span>

                @for (type of riskTypes(doc); track type) {
                  <span
                    class="rounded-full px-1.5 py-0.5 text-[11px] font-semibold"
                    [class]="
                      type === 'PRIVILEGE'
                        ? 'bg-amber-100 text-amber-900'
                        : 'bg-rose-100 text-rose-800'
                    "
                  >
                    {{ type }}
                  </span>
                }
              </div>
            </button>
          </li>
        }
      </ul>
    </div>

    <!-- Paginator -->
    <div class="border-surface shrink-0 border-t">
      <p-paginator
        [rows]="rows()"
        [first]="first()"
        [totalRecords]="total()"
        [showPageLinks]="true"
        [pageLinkSize]="3"
        (onPageChange)="onPage($event)"
      />
    </div>
  } @else {
    <!-- Empty state -->
    <div class="flex flex-1 flex-col items-center justify-center gap-3 p-6 text-center">
      <i class="pi pi-filter-slash text-muted-color text-2xl"></i>
      <p class="text-muted-color text-xs">No documents match the current filters.</p>
      <button
        pButton
        type="button"
        size="small"
        severity="secondary"
        [outlined]="true"
        (click)="resetFilters.emit()"
      >
        Reset Filters
      </button>
    </div>
  }
</div>
