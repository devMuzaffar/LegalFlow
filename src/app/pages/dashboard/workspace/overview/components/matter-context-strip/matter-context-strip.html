<section
  class="flex h-full flex-wrap items-center justify-between gap-3 rounded-border border border-surface bg-surface-0 px-4 py-3"
>
  <div class="flex flex-col gap-1">
    <span class="text-[11px] font-medium uppercase tracking-wide text-muted-color">
      Active matter
    </span>
    <div class="flex flex-wrap items-center gap-2">
      <h1 class="text-lg font-semibold text-surface-900">{{ matter().name }}</h1>
      <p-tag [value]="matter().id" severity="secondary" />
      @if (matter().legalHold) {
        <p-tag value="Legal Hold: Active" icon="pi pi-lock" severity="warn" [rounded]="true" />
      }
    </div>
  </div>

  <!-- pButton is a directive on <a>: the label is projected content, not an input -->
  <a pButton routerLink="/document-review" size="small">
    <i class="pi pi-play mr-1"></i>
    Resume Review Queue
  </a>
</section>
