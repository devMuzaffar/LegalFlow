<app-card title="Review Velocity">
  <div
    action
    class="flex h-9 w-9 items-center justify-center rounded-lg bg-emerald-50 text-emerald-700"
  >
    <i class="pi pi-bolt text-sm"></i>
  </div>

  <div class="flex flex-1 flex-col gap-4">
    <p class="text-2xl font-semibold leading-none text-surface-900">{{ codedPct() }}%</p>

    <p-progressbar [value]="codedPct()" [showValue]="false" [style]="{ height: '6px' }" />

    <p class="text-xs text-muted-color">
      <span class="font-semibold text-surface-900">{{ coded() | number }}</span> done /
      <span class="font-semibold text-surface-900">{{ pending() | number }}</span> pending
    </p>
  </div>
</app-card>
