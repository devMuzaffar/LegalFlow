<section class="h-full rounded-border border border-surface bg-surface-0 p-4">
  <header class="mb-3 flex flex-wrap items-center justify-between gap-2">
    <div class="flex items-center gap-2">
      <h2 class="text-[11px] font-semibold uppercase tracking-wide text-muted-color">
        Automated processing pipeline
      </h2>
      <p-tag
        [value]="done() + '/' + steps().length + ' complete'"
        severity="secondary"
        [rounded]="true"
      />
    </div>
    <a routerLink="/processing-jobs" class="text-xs font-medium text-primary hover:underline">
      View processing jobs →
    </a>
  </header>

  <ol class="flex flex-wrap gap-2">
    @for (step of steps(); track step.label; let i = $index) {
      <li
        class="min-w-36 flex-1 rounded-border bg-surface-50 p-2.5"
        [pTooltip]="step.detail"
        tooltipPosition="top"
        [showDelay]="300"
      >
        <div class="flex items-center gap-1.5">
          <p-tag
            [value]="'' + (i + 1)"
            [severity]="isComplete(step) ? 'success' : 'info'"
            [rounded]="true"
          />
          <span class="truncate text-[11px] font-medium text-surface-900">{{ step.label }}</span>
        </div>

        <p-progressbar
          class="mt-2 block"
          [value]="step.progress"
          [showValue]="false"
          [style]="{ height: '4px' }"
        />

        <span class="mt-1 block text-[10px] text-muted-color">
          {{ step.progress }}% · {{ isComplete(step) ? 'complete' : 'running' }}
        </span>
      </li>
    }
  </ol>

  <p-tag class="mt-3" [value]="'Overall ' + overallPct() + '%'" severity="info" [rounded]="true" />
</section>
