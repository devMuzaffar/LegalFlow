<app-card title="Automated processing pipeline">
  <a action routerLink="/processing-jobs" class="text-xs font-medium text-primary hover:underline">
    View processing jobs →
  </a>

  <div class="flex items-center justify-between gap-2">
    <p-tag [value]="done() + '/' + steps().length + ' complete'" severity="secondary" />
    <p-tag [value]="'Overall ' + overallPct() + '%'" severity="info" />
  </div>

  <ol class="flex flex-wrap gap-2">
    @for (step of steps(); track step.label; let i = $index) {
      <li
        class="min-w-36 flex-1 rounded-border bg-surface-50 p-2.5"
        [pTooltip]="step.detail"
        tooltipPosition="top"
        [showDelay]="300"
      >
        <div class="flex items-center gap-1.5">
          <p-tag [value]="'' + (i + 1)" [severity]="isComplete(step) ? 'success' : 'info'" />
          <span class="truncate text-[11px] font-medium text-surface-900">{{ step.label }}</span>
        </div>

        <p-progressbar
          class="mt-2 block"
          [value]="step.progress"
          [showValue]="false"
          [style]="{ height: '4px' }"
        />

        <span class="mt-1 block text-[10px] text-muted-color">
          {{ step.progress }}% · {{ isComplete(step) ? 'complete' : 'running' }}
        </span>
      </li>
    }
  </ol>
</app-card>
