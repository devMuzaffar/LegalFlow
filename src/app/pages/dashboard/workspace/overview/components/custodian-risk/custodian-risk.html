<section class="rounded-border border border-surface bg-surface-0 p-4">
  <header class="mb-2 flex items-center justify-between gap-2">
    <h2 class="text-[11px] font-semibold uppercase tracking-wide text-muted-color">
      Custodian risk breakdown
    </h2>
    <span class="text-[11px] text-muted-color">{{ custodians().length }} custodians</span>
  </header>

  <p-table [value]="rows()" dataKey="id" [showGridlines]="false">
    <ng-template #header>
      <tr>
        <th pSortableColumn="name">Custodian</th>
        <th class="text-right">Docs</th>
        <th class="text-right">PII/PHI</th>
        <th class="text-right">Priv.</th>
        <th>Review</th>
        <th></th>
      </tr>
    </ng-template>

    <ng-template #body let-c>
      <tr>
        <td class="font-medium text-surface-900">{{ c.name }}</td>
        <td class="text-right tabular-nums">{{ c.totalDocs | number }}</td>
        <td class="text-right">
          <p-tag [value]="(c.piiCount | number) ?? ''" severity="warn" [rounded]="true" />
        </td>
        <td class="text-right">
          <p-tag [value]="(c.privilegeCount | number) ?? ''" severity="danger" [rounded]="true" />
        </td>
        <td>
          <div class="flex items-center gap-2">
            <p-progressbar
              class="w-16"
              [value]="reviewPct(c)"
              [showValue]="false"
              [style]="{ height: '4px' }"
            />
            <span class="w-7 text-right tabular-nums text-[11px] text-muted-color">
              {{ reviewPct(c) }}%
            </span>
          </div>
        </td>
        <td class="text-right">
          <a
            pButton
            size="small"
            [text]="true"
            severity="secondary"
            icon="pi pi-search"
            routerLink="/document-review"
            [queryParams]="{ custodian: c.id }"
            aria-label="Inspect custodian"
          ></a>
        </td>
      </tr>
    </ng-template>
  </p-table>
</section>
