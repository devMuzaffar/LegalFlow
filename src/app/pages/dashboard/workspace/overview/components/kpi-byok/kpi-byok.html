<app-card title="BYOK Usage Meter">
  <div
    action
    class="flex h-9 w-9 items-center justify-center rounded-lg bg-amber-50 text-amber-700"
  >
    <i class="pi pi-key text-sm"></i>
  </div>

  <div class="flex flex-1 flex-col gap-4">
    <div class="flex items-start justify-between gap-2">
      <p class="text-2xl font-semibold leading-none text-surface-900">
        {{ vaultGb() }} <span class="text-xs font-normal text-muted-color">GB vault</span>
      </p>
      <p-tag value="own key" severity="secondary" />
    </div>

    <p class="text-xs text-muted-color">
      <span class="font-semibold text-surface-900">{{ tokensM() }}M</span> tokens ·
      <span class="font-semibold text-emerald-700">${{ perDocFee() }}</span> per-doc AI fee
    </p>
  </div>
</app-card>
