<app-card title="Ingestion &amp; Dedup">
  <div action class="flex h-9 w-9 items-center justify-center rounded-lg bg-sky-50 text-sky-700">
    <i class="pi pi-database text-sm"></i>
  </div>

  <div class="flex flex-1 flex-col gap-4">
    <div class="flex items-start justify-between gap-2">
      <p class="text-2xl font-semibold leading-none text-surface-900">
        {{ uploaded() | number }}
        <span class="text-xs font-normal text-muted-color">uploaded</span>
      </p>
      <p-tag [value]="'+' + dedupPct() + '%'" severity="success" />
    </div>

    <p class="text-xs text-muted-color">
      <span class="font-semibold text-surface-900">{{ reviewReady() | number }}</span>
      review-ready · {{ dedupPct() }}% SHA-256 duplicates removed
    </p>
  </div>
</app-card>
