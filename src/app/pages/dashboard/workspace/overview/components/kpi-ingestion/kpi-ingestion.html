<p-card class="flex h-full flex-col">
  <header class="flex items-start justify-between gap-2">
    <h2 class="text-[11px] font-semibold uppercase tracking-wide text-muted-color">
      Ingestion &amp; Dedup
    </h2>
    <p-tag [value]="dedupPct() + '%'" severity="success" [rounded]="true" />
  </header>

  <p class="mt-2 text-2xl font-semibold leading-none text-surface-900">
    {{ uploaded() | number }}
    <span class="text-xs font-normal text-muted-color">uploaded</span>
  </p>

  <p class="mt-2 text-xs text-muted-color">
    <span class="font-semibold text-surface-900">{{ reviewReady() | number }}</span>
    review-ready · {{ dedupPct() }}% SHA-256 duplicates removed
  </p>
</p-card>
