<app-card title="AI Risk Flags">
  <div action class="flex h-9 w-9 items-center justify-center rounded-lg bg-rose-50 text-rose-700">
    <i class="pi pi-shield text-sm"></i>
  </div>

  <div class="flex flex-1 flex-col gap-4">
    <div class="flex flex-col gap-2">
      <div class="flex items-center justify-between gap-2">
        <span class="text-[11px] text-muted-color">Privilege</span>
        <p-tag [value]="privilegeLabel()" severity="danger" />
      </div>

      <div class="flex items-center justify-between gap-2">
        <span class="text-[11px] text-muted-color">PII/PHI</span>
        <p-tag [value]="piiLabel()" severity="warn" />
      </div>

      <div class="flex items-center justify-between gap-2">
        <span class="text-[11px] text-muted-color">Human-Reversed</span>
        <p-tag [value]="reversedLabel()" severity="secondary" />
      </div>
    </div>

    <p class="text-xs text-muted-color">AI pre-scan · human review overrides applied</p>
  </div>
</app-card>
