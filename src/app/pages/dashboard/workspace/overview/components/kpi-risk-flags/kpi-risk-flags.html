<p-card class="flex h-full flex-col">
  <header class="flex items-start justify-between gap-2">
    <h2 class="text-[11px] font-semibold uppercase tracking-wide text-muted-color">
      AI Risk Flags
    </h2>
    <span class="text-[11px] font-medium text-muted-color">pre-scan</span>
  </header>

  <div class="mt-3 flex flex-col gap-2">
    <div class="flex items-center justify-between gap-2">
      <span class="text-[11px] text-muted-color">Privilege</span>
      <p-tag [value]="privilegeLabel()" severity="danger" [rounded]="true" />
    </div>

    <div class="flex items-center justify-between gap-2">
      <span class="text-[11px] text-muted-color">PII/PHI</span>
      <p-tag [value]="piiLabel()" severity="warn" [rounded]="true" />
    </div>

    <div class="flex items-center justify-between gap-2">
      <span class="text-[11px] text-muted-color">Human-Reversed</span>
      <p-tag [value]="reversedLabel()" severity="secondary" [rounded]="true" />
    </div>
  </div>
</p-card>
