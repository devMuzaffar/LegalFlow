<section class="flex h-full flex-col gap-3 rounded-border border border-surface bg-surface-0 p-4">
  @if (title() || subtitle()) {
    <header class="mb-4 flex flex-wrap items-center justify-between gap-x-3 gap-y-2">
      <div class="flex min-w-48 flex-1 flex-col">
        @if (title()) {
          <h2 class="text-color font-semibold leading-6">{{ title() }}</h2>
        }
        @if (subtitle()) {
          <p class="text-xs leading-5 text-muted-color">{{ subtitle() }}</p>
        }
      </div>

      <!-- Action slot: pinned to the far right of the header line -->
      <div class="flex shrink-0 flex-wrap items-center justify-end gap-2 empty:hidden">
        <ng-content select="[action]" />
      </div>
    </header>
  }

  <!-- Body -->
  <div class="flex flex-1 flex-col gap-3 empty:hidden">
    <ng-content />
  </div>
</section>
