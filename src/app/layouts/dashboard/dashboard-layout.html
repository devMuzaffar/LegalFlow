<p-sidebar-layout class="h-screen overflow-hidden">
  <!-- Mobile backdrop -->
  @if (isMobile() && open()) {
    <p-sidebar-backdrop />
  }

  <!-- Sidebar -->
  <p-sidebar
    id="dashboard-sidebar"
    [collapsible]="isMobile() ? 'offcanvas' : 'icon'"
    [overlay]="isMobile()"
    [(open)]="open"
  >
    <p-sidebar-spacer />

    <p-sidebar-aside>
      <p-sidebar-panel>
        <app-sidebar />
      </p-sidebar-panel>
    </p-sidebar-aside>
  </p-sidebar>

  <!-- Main content -->
  <p-sidebar-main>
    <!-- Header -->
    <app-header />

    <!-- Body -->
    <!-- Scroll container: page grid + footer live here so the footer scrolls away -->
    <div class="flex min-h-0 flex-1 flex-col overflow-auto">
      <!-- Grid: router-outlet hidden, page host dissolved, children span 12 by default -->
      <main
        class="grid flex-1 grid-cols-12 content-start gap-4 p-4 [&>*:not(router-outlet)]:contents [&>router-outlet]:hidden [:where(&)>*>*]:col-span-12"
      >
        <router-outlet />
      </main>

      <!-- Footer -->
      <footer class="border-surface h-12 border-t p-4">
        <p class="text-muted-color text-xs">© {{ year }} LegalFlow. All rights reserved.</p>
      </footer>
    </div>
  </p-sidebar-main>
</p-sidebar-layout>
