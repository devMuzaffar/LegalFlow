<p-sidebar-layout class="min-h-screen">
  <!-- Mobile backdrop -->
  @if (isMobile() && open()) {
    <p-sidebar-backdrop />
  }

  <!-- Sidebar -->
  <p-sidebar
    id="dashboard-sidebar"
    [collapsible]="isMobile() ? 'offcanvas' : 'icon'"
    [overlay]="isMobile()"
    [(open)]="open"
  >
    <p-sidebar-spacer />

    <p-sidebar-aside>
      <p-sidebar-panel>
        <app-sidebar />
      </p-sidebar-panel>
    </p-sidebar-aside>
  </p-sidebar>

  <!-- Main content -->
  <p-sidebar-main>
    <!-- Header -->
    <app-header />

    <!-- Body -->
    <!-- Router-outlet renders as element so needs to disable, else it will be treated as div causing issues -->
    <!-- router-outlet is an anchor, bottom is where out actual page renders -->
    <main
      class="flex-1 overflow-auto p-4 grid grid-cols-12 gap-4 content-start [&>router-outlet]:hidden [&>*:not(router-outlet)]:contents [:where(&)>*>*]:col-span-12"
    >
      <router-outlet />
    </main>

    <!-- Footer -->
    <footer class="border-t border-surface px-4 py-3 text-xs text-muted-color">
      <p>© {{ year }} LegalFlow. All rights reserved.</p>
    </footer>
  </p-sidebar-main>
</p-sidebar-layout>
