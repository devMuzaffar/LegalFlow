<p-sidebar-layout class="h-screen overflow-hidden">
  <!-- Mobile backdrop -->
  @if (isMobile() && open()) {
    <p-sidebar-backdrop />
  }

  <!-- Sidebar -->
  <p-sidebar
    id="dashboard-sidebar"
    [collapsible]="isMobile() ? 'offcanvas' : 'icon'"
    [overlay]="isMobile()"
    [(open)]="open"
  >
    <p-sidebar-spacer />

    <p-sidebar-aside>
      <p-sidebar-panel>
        <app-sidebar />
      </p-sidebar-panel>
    </p-sidebar-aside>
  </p-sidebar>

  <!-- Main content -->
  <p-sidebar-main>
    <!-- Header -->
    <app-header />

    <!-- Body -->
    <!-- Scroll container: the page grid AND the footer live inside it, so the
         footer scrolls away with the content instead of staying pinned. -->
    <!-- Router-outlet renders as element so needs to disable, else it will be treated as div causing issues -->
    <!-- router-outlet is an anchor, bottom is where out actual page renders -->
    <!-- Router Outlet stays hidden while others as display:content -->
    <div class="min-h-0 flex-1 overflow-auto">
      <main
        class="p-4 grid grid-cols-12 gap-4 content-start [&>router-outlet]:hidden [&>*:not(router-outlet)]:contents [:where(&)>*>*]:col-span-12"
      >
        <router-outlet />
      </main>

      <!-- Footer (non-sticky) -->
      <footer class="border-t border-surface px-4 py-3 text-xs text-muted-color">
        <p>© {{ year }} LegalFlow. All rights reserved.</p>
      </footer>
    </div>
  </p-sidebar-main>
</p-sidebar-layout>
