<p-sidebar-layout class="h-screen overflow-hidden">
  <!-- Mobile backdrop -->
  @if (isMobile() && open()) {
    <p-sidebar-backdrop />
  }

  <!-- Sidebar -->
  <p-sidebar
    id="dashboard-sidebar"
    [collapsible]="isMobile() ? 'offcanvas' : 'icon'"
    [overlay]="isMobile()"
    [(open)]="open"
  >
    <p-sidebar-spacer />

    <p-sidebar-aside>
      <p-sidebar-panel>
        <app-sidebar />
      </p-sidebar-panel>
    </p-sidebar-aside>
  </p-sidebar>

  <!-- Main content -->
  <p-sidebar-main>
    <!-- Header -->
    <app-header />

    <!-- Body -->
    <!-- Scroll container: page grid + footer live here so the footer scrolls away -->
    <div class="flex min-h-0 flex-1 flex-col overflow-auto">
      <!-- Grid: router-outlet hidden, page host dissolved, children span 12 by default -->
      <main
        class="p-4 flex-1 grid grid-cols-12 gap-4 content-start [&>router-outlet]:hidden [&>*:not(router-outlet)]:contents [:where(&)>*>*]:col-span-12"
      >
        <router-outlet />
      </main>

      <!-- Footer (non-sticky, fixed 40px, pinned to the viewport while the page is short) -->
      <footer
        class="flex h-10 shrink-0 items-center border-t border-surface px-4 text-xs text-muted-color"
      >
        <p>© {{ year }} LegalFlow. All rights reserved.</p>
      </footer>
    </div>
  </p-sidebar-main>
</p-sidebar-layout>
